[project]
name = "metaflow-2-grafana"
version = "0.1.0"
description = "Metaflow to Grafana integration - ML pipeline monitoring and visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "metaflow>=2.12.0",
    "grafana-client>=3.0.0",
    "prometheus-client>=0.20.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "returns>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
